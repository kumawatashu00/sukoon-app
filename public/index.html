<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Sukoon - Ultra Premium Social</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#020617">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* 🔥 Ultra Pro Styling 🔥 */
    .app-screen { height: 100vh; height: 100dvh; height: -webkit-fill-available; }
    
    /* डार्क-ग्लास थीम और बैकग्राउंड */
    body { background-color: #020617; color: #e2e8f0; }
    .glass-panel {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }
    .glass-card:hover { transform: translateY(-3px); border-color: rgba(225, 29, 72, 0.4); box-shadow: 0 10px 40px -10px rgba(225, 29, 72, 0.3); }
    
    .video-feed { background: #0f172a; object-fit: cover; }
    .filter-none { filter: none; } .filter-blur { filter: blur(10px); } .filter-bw { filter: grayscale(100%); } .filter-sepia { filter: sepia(80%); }

    /* एनिमेशन्स */
    @keyframes pulse-glow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.05); } }
    .neon-pulse { animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes giftPop { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1) translateY(-60px); opacity: 0; } }
    .gift-animation { animation: giftPop 2.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    
    .stream-chat-scroll::-webkit-scrollbar { width: 4px; }
    .stream-chat-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    /* पासपोर्ट-साइज़ (3:4) बड़ा वीडियो कार्ड */
    .passport-video-card { aspect-ratio: 3 / 4; height: 230px; max-height: 38vh; border-radius: 1.25rem; overflow: hidden; position: relative; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); }
    @media (min-width: 640px) { .passport-video-card { height: 280px; } }

    /* Instagram स्टाइल गोल नेविगेशन बटन */
    .nav-circle-btn { width: 42px; height: 42px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .nav-circle-btn.active { background: rgba(225, 29, 72, 0.2); color: #fb7185; border: 1px solid rgba(225, 29, 72, 0.4); transform: translateY(-2px); }
    
    /* Background Glow Effects */
    .bg-glow-orb { position: absolute; width: 300px; height: 300px; background: radial-gradient(circle, rgba(225,29,72,0.15) 0%, rgba(0,0,0,0) 70%); border-radius: 50%; top: -10%; left: -10%; pointer-events: none; z-index: 0; }
  </style>
</head>

  <!-- Remaining Modals & JS Logic (Kept exactly same, just listening to global_online_count) -->
  <script>
    // .. [Translations and variables remain same] ..
    let currentLang = 'hi'; let socket; let currentMode = 'text'; let selectedTag = 'All'; let localStream = null;
    let randomFacingMode = "user"; let peerConnection = null; let isInitiator = false;
    let isMuted = false; let isCamOff = false; const filters = ['filter-none', 'filter-blur', 'filter-bw', 'filter-sepia']; let filterIndex = 0;
    const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
    let loggedInUser = null;

    window.addEventListener("load", () => { initSocket(); setupMobileKeyboardHandler(); });

    function switchMainTab(tab) {
      // Hide all, show selected. For brevity, assuming only Home/Room logic is here.
      if (tab === 'home') { document.getElementById('roomScreen').classList.add('hidden'); document.getElementById('homeScreen').classList.remove('hidden'); }
    }

    function setupMobileKeyboardHandler() {
      const msgInput = document.getElementById("msgInput"); const messagesBox = document.getElementById("messagesBox");
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", () => { document.body.style.height = `${window.visualViewport.height}px`; if (messagesBox) messagesBox.scrollTop = messagesBox.scrollHeight; });
      }
    }

    function initSocket() {
      if (socket) return;
      socket = io();

      // 🔥 NEW FEATURE: Listen to global online count
      socket.on("global_online_count", (count) => {
        const el = document.getElementById("globalOnlineCountUI");
        if(el) el.innerText = count || 0;
      });

      socket.on("partner_found", (data) => {
        isInitiator = data.isInitiator;
        document.getElementById("roomStatusBadge").innerText = "Online 🟢";
        document.getElementById("videoWaitingNotice").classList.add("hidden");
        appendSystemMessage(data.partnerName ? `${data.partnerName} Connected!` : "Stranger Connected!");
        if (currentMode === 'video') initRandomPeerConnection();
      });

      socket.on("receive_message", ({ text, timestamp }) => appendMessage(text, "partner", timestamp));
      socket.on("webrtc_signal", async (signal) => {
        if (!peerConnection) return;
        if (signal.sdp) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.sdp));
          if (signal.sdp.type === "offer") { const answer = await peerConnection.createAnswer(); await peerConnection.setLocalDescription(answer); socket.emit("webrtc_signal", { sdp: peerConnection.localDescription }); }
        } else if (signal.candidate) { await peerConnection.addIceCandidate(new RTCIceCandidate(signal.candidate)); }
      });

      socket.on("partner_disconnected", () => {
        document.getElementById("roomStatusBadge").innerText = "Disconnected";
        document.getElementById("videoWaitingNotice").classList.remove("hidden");
        appendSystemMessage("Stranger left. Press 'Next'.");
        closePeer();
      });
    }

    async function startApp(mode) {
      currentMode = mode;
      document.getElementById('homeScreen').classList.add('hidden');
      document.getElementById('roomScreen').classList.remove('hidden');
      if (mode === 'video') {
        document.getElementById('videoSection').classList.remove('hidden');
        await startRandomCamera();
      } else { document.getElementById('videoSection').classList.add('hidden'); }
      socket.emit("find_partner", { mode: currentMode, tag: selectedTag, email: null, name: null });
    }

    // 🔥 बग फिक्स: कैमरा परमिशन क्रैश फिक्स
    async function startRandomCamera() {
      try {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: randomFacingMode, aspectRatio: { ideal: 0.75 } }, audio: true });
        document.getElementById('localVideo').srcObject = localStream;
      } catch (err) { 
        alert("आपने कैमरा या माइक की परमिशन नहीं दी है। कृपया ब्राउज़र सेटिंग में परमिशन दें!"); 
        goHome(); 
      }
    }

    function initRandomPeerConnection() {
      closePeer();
      peerConnection = new RTCPeerConnection(rtcConfig);
      if (localStream) localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      peerConnection.ontrack = (event) => { document.getElementById('remoteVideo').srcObject = event.streams[0]; };
      peerConnection.onicecandidate = (event) => { if (event.candidate) socket.emit("webrtc_signal", { candidate: event.candidate }); };
      if (isInitiator) { peerConnection.createOffer().then(offer => { peerConnection.setLocalDescription(offer); socket.emit("webrtc_signal", { sdp: offer }); }); }
    }

    function closePeer() { if (peerConnection) { peerConnection.close(); peerConnection = null; } document.getElementById('remoteVideo').srcObject = null; }

    function handleSendSubmit(e) {
      e.preventDefault(); const inp = document.getElementById('msgInput'); const text = inp.value.trim();
      if (!text || !socket) return;
      socket.emit("send_message", { text });
      appendMessage(text, "me", new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
      inp.value = "";
    }

    function appendMessage(text, who, time) {
      const box = document.getElementById("messagesBox"); const div = document.createElement("div");
      div.className = who === "me" ? "flex justify-end" : "flex justify-start";
      div.innerHTML = `<div class="max-w-[80%] px-4 py-2 rounded-2xl text-xs shadow-sm ${who === "me" ? "bg-gradient-to-r from-rose-500 to-indigo-600 text-white font-medium border border-rose-400/30" : "bg-slate-800 text-slate-200 border border-slate-700"}"><p class="leading-relaxed whitespace-pre-wrap">${text}</p><span class="text-[9px] block mt-1 opacity-50 text-right">${time}</span></div>`;
      box.appendChild(div); box.scrollTop = box.scrollHeight;
    }

    function appendSystemMessage(msg) {
      const box = document.getElementById("messagesBox"); const div = document.createElement("div"); div.className = "text-center my-1.5";
      div.innerHTML = `<span class="text-[9px] bg-slate-800 border border-slate-700 px-3 py-1 rounded-full text-slate-400 uppercase tracking-widest">${msg}</span>`;
      box.appendChild(div); box.scrollTop = box.scrollHeight;
    }

    function nextPartner() {
      closePeer(); document.getElementById("messagesBox").innerHTML = "";
      document.getElementById("roomStatusBadge").innerText = "Searching...";
      document.getElementById("videoWaitingNotice").classList.remove("hidden");
      if (socket) socket.emit("find_partner", { mode: currentMode, tag: selectedTag });
    }

    function goHome() {
      closePeer(); if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      if (socket) socket.emit("leave_chat"); document.getElementById('messagesBox').innerHTML = ''; switchMainTab('home');
    }
    
    function toggleAudio() { if (!localStream) return; isMuted = !isMuted; localStream.getAudioTracks().forEach(t => t.enabled = !isMuted); document.getElementById('micBtn').innerText = isMuted ? "🔇" : "🎙️"; }
    function toggleVideo() { if (!localStream) return; isCamOff = !isCamOff; localStream.getVideoTracks().forEach(t => t.enabled = !isCamOff); document.getElementById('camBtn').innerText = isCamOff ? "🚫" : "📹"; }
    function flipRandomCamera() { randomFacingMode = (randomFacingMode === "user" ? "environment" : "user"); startRandomCamera().then(()=>{ if(peerConnection && localStream){ const s = peerConnection.getSenders().find(s=>s.track.kind==="video"); if(s) s.replaceTrack(localStream.getVideoTracks()[0]); } }); }
    function cycleFilter() { filterIndex = (filterIndex + 1) % filters.length; document.getElementById('localVideo').className = `w-full h-full video-feed ${filters[filterIndex]}`; }
  </script>
</body>
</html>

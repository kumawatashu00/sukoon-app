<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Sukoon - Anonymous Video & Text Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    .app-screen {
      height: 100dvh;
      height: -webkit-fill-available;
    }
    .video-feed {
      background: #0b0f19;
      object-fit: cover;
    }
  </style>
</head>
<body class="bg-[#070b14] text-slate-100 font-sans app-screen flex flex-col overflow-hidden selection:bg-rose-500/30">

  <!-- ================= 1. HOME SCREEN ================= -->
  <div id="homeScreen" class="flex-1 flex flex-col justify-between p-6 max-w-lg w-full mx-auto overflow-y-auto">
    <!-- Brand Logo -->
    <div class="text-center pt-8 space-y-3">
      <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-rose-500 via-pink-500 to-indigo-500 mx-auto flex items-center justify-center text-3xl shadow-2xl shadow-pink-500/20">
        🌿
      </div>
      <h1 class="text-4xl font-black tracking-tight bg-gradient-to-r from-rose-200 via-pink-200 to-teal-200 bg-clip-text text-transparent">
        सुकून
      </h1>
      <p class="text-xs text-slate-400 font-medium">
        100% अनाम • बिना किसी पहचान के किसी नए से जुड़ें
      </p>
    </div>

    <!-- Mode Selection Cards (Text vs Video) -->
    <div class="space-y-4 my-auto py-6">
      <!-- Text Chat Card -->
      <button onclick="startApp('text')" class="w-full text-left p-5 rounded-3xl bg-gradient-to-br from-slate-900/90 to-slate-900/40 border border-white/10 hover:border-teal-400/50 hover:bg-slate-800/60 transition shadow-xl group">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-teal-500/20 border border-teal-500/30 flex items-center justify-center text-2xl group-hover:scale-110 transition">
              💬
            </div>
            <div>
              <h2 class="text-base font-black text-teal-200">टेक्स्ट चैट (Text Chat)</h2>
              <p class="text-xs text-slate-400 mt-0.5">बिना कैमरा ऑन किए दिल की बात साझा करें</p>
            </div>
          </div>
          <span class="text-slate-500 text-lg group-hover:translate-x-1 group-hover:text-teal-300 transition">➔</span>
        </div>
      </button>

      <!-- Video Call Card (Omegle Style) -->
      <button onclick="startApp('video')" class="w-full text-left p-5 rounded-3xl bg-gradient-to-br from-slate-900/90 to-slate-900/40 border border-white/10 hover:border-rose-400/50 hover:bg-slate-800/60 transition shadow-xl group">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-rose-500/20 border border-rose-500/30 flex items-center justify-center text-2xl group-hover:scale-110 transition">
              📹
            </div>
            <div>
              <h2 class="text-base font-black text-rose-200">वीडियो कॉल (Omegle Style)</h2>
              <p class="text-xs text-slate-400 mt-0.5">कैमरे के साथ रैंडम साथियों से फेस-टू-फेस मिलें</p>
            </div>
          </div>
          <span class="text-slate-500 text-lg group-hover:translate-x-1 group-hover:text-rose-300 transition">➔</span>
        </div>
      </button>
    </div>

    <!-- 18+ Disclaimer -->
    <div class="text-center pb-4 text-[11px] text-slate-500">
      🔒 यह प्लेटफ़ॉर्म 18+ यूज़र्स के लिए है। आपकी कोई भी निजी जानकारी सेव नहीं की जाती।
    </div>
  </div>


  <!-- ================= 2. ACTIVE ROOM SCREEN (TEXT OR VIDEO) ================= -->
  <div id="roomScreen" class="hidden flex-1 flex flex-col overflow-hidden">
    
    <!-- Top Bar with Home & Skip Button -->
    <header class="px-4 py-2.5 bg-[#0b101c] border-b border-white/5 flex justify-between items-center shrink-0">
      <div class="flex items-center gap-2">
        <button onclick="goHome()" class="px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-xs font-bold text-slate-200 border border-white/10 flex items-center gap-1.5 transition">
          <span>🏠</span> <span>होम</span>
        </button>
        <span id="roomStatusBadge" class="text-[11px] px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 font-medium">तलाश जारी...</span>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="nextPartner()" id="nextBtn" class="px-4 py-1.5 rounded-xl bg-gradient-to-r from-rose-500 to-pink-500 text-slate-950 text-xs font-bold shadow-md hover:opacity-95 transition">
          Next ➔
        </button>
      </div>
    </header>

    <!-- Room Content Area -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden p-2 gap-2">

      <!-- Video Section (Only active in Video mode) -->
      <section id="videoSection" class="hidden flex-1 flex flex-row md:flex-col gap-2 min-h-[190px] md:min-h-0 relative">
        <!-- Remote Stranger Video -->
        <div class="relative flex-1 rounded-2xl overflow-hidden border border-white/10 bg-slate-950 flex items-center justify-center">
          <video id="remoteVideo" autoplay playsinline class="w-full h-full video-feed"></video>
          <span class="absolute bottom-2 left-2 text-[10px] bg-black/60 px-2 py-0.5 rounded-lg text-slate-300 font-semibold border border-white/5">
            साथी (Stranger)
          </span>
          <div id="videoWaitingNotice" class="absolute inset-0 flex flex-col items-center justify-center text-center p-4">
            <div class="w-9 h-9 rounded-full border-2 border-rose-400 border-t-transparent animate-spin mb-2"></div>
            <span class="text-xs text-slate-400 font-medium">साथी ढूँढ रहे हैं...</span>
          </div>
        </div>

        <!-- Local Video (You) -->
        <div class="relative flex-1 rounded-2xl overflow-hidden border border-white/10 bg-slate-950 flex items-center justify-center">
          <video id="localVideo" autoplay playsinline muted class="w-full h-full video-feed"></video>
          <span class="absolute bottom-2 left-2 text-[10px] bg-black/60 px-2 py-0.5 rounded-lg text-slate-300 font-semibold border border-white/5">
            आप (You)
          </span>
          <div class="absolute top-2 right-2 flex gap-1.5">
            <button onclick="toggleAudio()" id="micBtn" class="p-1.5 rounded-xl bg-slate-900/80 border border-white/10 text-xs text-teal-300">🎙️</button>
            <button onclick="toggleVideo()" id="camBtn" class="p-1.5 rounded-xl bg-slate-900/80 border border-white/10 text-xs text-pink-300">📹</button>
          </div>
        </div>
      </section>

      <!-- Chat Section (Available in both modes) -->
      <section class="flex-1 flex flex-col rounded-2xl border border-white/10 bg-[#0c1222]/80 backdrop-blur-xl overflow-hidden">
        <!-- Messages Area -->
        <div id="messagesBox" class="flex-1 overflow-y-auto p-3 space-y-2">
          <div class="text-center py-4 text-xs text-slate-500">
            🌱 आप एक अनाम साथी से जुड़े हैं।
          </div>
        </div>

        <!-- Input Bar (Mobile Keyboard Aware) -->
        <form id="chatForm" onsubmit="handleSendSubmit(event)" class="p-2 border-t border-white/5 bg-[#090d18] flex items-center gap-2 shrink-0">
          <input
            type="text"
            id="msgInput"
            enterkeyhint="send"
            autocomplete="off"
            placeholder="मैसेज लिखें और 'Enter' दबाएँ..."
            class="flex-1 bg-slate-900/90 border border-white/10 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 placeholder:text-slate-500 focus:outline-none focus:border-rose-400"
          >
          <button type="submit" class="px-4 py-2.5 bg-gradient-to-r from-rose-400 to-pink-400 text-slate-950 font-bold rounded-xl text-xs shadow-md">
            भेजें
          </button>
        </form>
      </section>

    </main>
  </div>

  <script>
    let socket;
    let currentMode = 'text';
    let localStream = null;
    let peerConnection = null;
    let isInitiator = false;
    let isMuted = false;
    let isCamOff = false;

    const rtcConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    };

    window.addEventListener("load", () => {
      fixMobileViewport();
    });

    // मोबाइल पर कीबोर्ड खुलने पर स्क्रीन का साइज़ सही रखना
    function fixMobileViewport() {
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
          document.body.style.height = `${window.visualViewport.height}px`;
          scrollToBottom();
        });
      }
      const inp = document.getElementById('msgInput');
      inp.addEventListener('focus', () => {
        setTimeout(scrollToBottom, 300);
      });
    }

    async function startApp(mode) {
      currentMode = mode;
      document.getElementById('homeScreen').classList.add('hidden');
      document.getElementById('roomScreen').classList.remove('hidden');

      if (mode === 'video') {
        document.getElementById('videoSection').classList.remove('hidden');
        await startCamera();
      } else {
        document.getElementById('videoSection').classList.add('hidden');
      }

      initSocket();
    }

    async function startCamera() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;
      } catch (err) {
        alert("कैमरा या माइक की अनुमति नहीं मिली। कृपया ब्राउज़र सेटिंग्स में चेक करें।");
      }
    }

    function initSocket() {
      if (!socket) {
        socket = io();

        socket.on("partner_found", (data) => {
          isInitiator = data.isInitiator;
          document.getElementById("roomStatusBadge").innerText = "ऑनलाइन 🟢";
          document.getElementById("roomStatusBadge").className = "text-[11px] px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 font-medium";
          document.getElementById("videoWaitingNotice").classList.add("hidden");
          appendSystemMessage("आप साथी से जुड़ चुके हैं!");

          if (currentMode === 'video') {
            initPeerConnection();
          }
        });

        socket.on("receive_message", ({ text, timestamp }) => {
          appendMessage(text, "partner", timestamp);
        });

        socket.on("webrtc_signal", async (signal) => {
          if (!peerConnection) return;
          try {
            if (signal.sdp) {
              await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.sdp));
              if (signal.sdp.type === "offer") {
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.emit("webrtc_signal", { sdp: peerConnection.localDescription });
              }
            } else if (signal.candidate) {
              await peerConnection.addIceCandidate(new RTCIceCandidate(signal.candidate));
            }
          } catch (e) {
            console.error("WebRTC Error:", e);
          }
        });

        socket.on("message_rejected", ({ reason }) => {
          alert(reason);
        });

        socket.on("partner_disconnected", () => {
          document.getElementById("roomStatusBadge").innerText = "डिस्कनेक्टेड";
          document.getElementById("roomStatusBadge").className = "text-[11px] px-2.5 py-1 rounded-full bg-rose-500/20 text-rose-300 font-medium";
          document.getElementById("videoWaitingNotice").classList.remove("hidden");
          appendSystemMessage("साथी ने कॉल छोड़ दी। नया साथी खोजने के लिए 'Next' दबाएँ।");
          closePeer();
        });
      }

      document.getElementById("roomStatusBadge").innerText = "तलाश जारी...";
      document.getElementById("roomStatusBadge").className = "text-[11px] px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 font-medium";
      document.getElementById("videoWaitingNotice").classList.remove("hidden");
      socket.emit("find_partner", { mode: currentMode });
    }

    function initPeerConnection() {
      closePeer();
      peerConnection = new RTCPeerConnection(rtcConfig);

      if (localStream) {
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      }

      peerConnection.ontrack = (event) => {
        document.getElementById('remoteVideo').srcObject = event.streams[0];
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit("webrtc_signal", { candidate: event.candidate });
        }
      };

      if (isInitiator) {
        peerConnection.createOffer().then(offer => {
          peerConnection.setLocalDescription(offer);
          socket.emit("webrtc_signal", { sdp: offer });
        });
      }
    }

    function closePeer() {
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      document.getElementById('remoteVideo').srcObject = null;
    }

    function handleSendSubmit(e) {
      e.preventDefault();
      const inp = document.getElementById('msgInput');
      const text = inp.value.trim();
      if (!text || !socket) return;

      socket.emit("send_message", { text });
      appendMessage(text, "me", new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
      inp.value = "";
      scrollToBottom();
    }

    function appendMessage(text, who, time) {
      const box = document.getElementById("messagesBox");
      const div = document.createElement("div");
      div.className = who === "me" ? "flex justify-end" : "flex justify-start";
      div.innerHTML = `
        <div class="max-w-[80%] px-3.5 py-2 rounded-2xl text-xs ${
          who === "me" ? "bg-gradient-to-r from-rose-400 to-pink-400 text-slate-950 font-medium rounded-br-none" : "bg-slate-800 text-slate-100 rounded-bl-none border border-white/5"
        }">
          <p class="leading-relaxed whitespace-pre-wrap">${text}</p>
          <span class="text-[9px] block mt-1 opacity-70 text-right">${time}</span>
        </div>`;
      box.appendChild(div);
      scrollToBottom();
    }

    function appendSystemMessage(msg) {
      const box = document.getElementById("messagesBox");
      const div = document.createElement("div");
      div.className = "text-center my-1";
      div.innerHTML = `<span class="text-[10px] bg-white/5 border border-white/10 px-2.5 py-1 rounded-full text-slate-400">${msg}</span>`;
      box.appendChild(div);
      scrollToBottom();
    }

    function scrollToBottom() {
      const box = document.getElementById("messagesBox");
      box.scrollTop = box.scrollHeight;
    }

    function nextPartner() {
      closePeer();
      document.getElementById("messagesBox").innerHTML = "";
      document.getElementById("roomStatusBadge").innerText = "तलाश जारी...";
      document.getElementById("roomStatusBadge").className = "text-[11px] px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 font-medium";
      document.getElementById("videoWaitingNotice").classList.remove("hidden");
      if (socket) {
        socket.emit("leave_chat");
        socket.emit("find_partner", { mode: currentMode });
      }
    }

    function goHome() {
      closePeer();
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      if (socket) {
        socket.emit("leave_chat");
      }
      document.getElementById('messagesBox').innerHTML = '';
      document.getElementById('roomScreen').classList.add('hidden');
      document.getElementById('homeScreen').classList.remove('hidden');
    }

    function toggleAudio() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
      document.getElementById('micBtn').innerText = isMuted ? "🔇" : "🎙️";
    }

    function toggleVideo() {
      if (!localStream) return;
      isCamOff = !isCamOff;
      localStream.getVideoTracks().forEach(t => t.enabled = !isCamOff);
      document.getElementById('camBtn').innerText = isCamOff ? "🚫" : "📹";
    }
  </script>
</body>
</html>

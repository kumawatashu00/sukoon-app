<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Sukoon - Ultra Premium</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#020617">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* 🌟 ULTRA PREMIUM DARK GLASSMORPHISM THEME 🌟 */
    body { background-color: #020617; color: #f1f5f9; }
    .app-screen { height: 100vh; height: 100dvh; height: -webkit-fill-available; }
    
    .glass-panel { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
    .glass-card { transition: all 0.3s ease; }
    .glass-card:hover { transform: translateY(-3px); border-color: rgba(225, 29, 72, 0.5); box-shadow: 0 10px 30px -10px rgba(225, 29, 72, 0.3); }

    /* Stories UI */
    .story-ring { background: linear-gradient(45deg, #f59e0b, #e11d48, #4f46e5); padding: 2.5px; border-radius: 50%; display: inline-block; }
    .story-img { border: 2px solid #020617; border-radius: 50%; object-fit: cover; }
    
    /* 3:4 Passport Video with Premium glow */
    .passport-video-card { aspect-ratio: 3 / 4; height: 230px; max-height: 38vh; border-radius: 1.25rem; overflow: hidden; position: relative; background: #0f172a; border: 1px solid rgba(255,255,255,0.05); }
    @media (min-width: 640px) { .passport-video-card { height: 280px; } }
    .video-feed { background: #0f172a; object-fit: cover; width: 100%; height: 100%; }

    /* Audio Room Animations */
    @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.5); opacity: 0; } }
    .audio-pulse::before { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid #10b981; animation: pulse-ring 2s infinite; }

    /* Floating Island Nav */
    .nav-island { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 2rem; }
    .nav-circle-btn { width: 44px; height: 44px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); color: #94a3b8; }
    .nav-circle-btn.active { background: rgba(225, 29, 72, 0.2); color: #fb7185; box-shadow: 0 0 15px rgba(225, 29, 72, 0.3); transform: translateY(-4px); }

    /* Game Board (Tic Tac Toe) */
    .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; background: rgba(255,255,255,0.1); padding: 5px; border-radius: 10px; width: 200px; margin: 10px auto; }
    .game-cell { background: #1e293b; height: 60px; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; cursor: pointer; border-radius: 6px; }
    
    .stream-chat-scroll::-webkit-scrollbar { width: 3px; }
    .stream-chat-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="font-sans app-screen flex flex-col overflow-hidden relative">

  <!-- ================= TOP HEADER (Glass) ================= -->
  <header class="px-4 py-3 glass-panel border-b-0 rounded-b-3xl flex justify-between items-center shrink-0 z-20 sticky top-0">
    <div class="flex items-center gap-3 cursor-pointer" onclick="switchMainTab('home')">
      <div class="w-10 h-10 rounded-[14px] bg-gradient-to-tr from-rose-500 via-pink-500 to-indigo-500 flex items-center justify-center text-xl text-white shadow-[0_0_15px_rgba(225,29,72,0.4)]">🌿</div>
      <div>
        <h1 class="text-base font-black tracking-widest text-white leading-none">SUKOON</h1>
        <span class="text-[9px] text-rose-400 font-bold uppercase tracking-widest">Premium Social</span>
      </div>
    </div>
    <div id="authContainer" class="flex items-center gap-2">
      <button onclick="toggleAuthModal()" id="authNavBtn" class="px-4 py-1.5 rounded-xl bg-rose-600 text-white text-xs font-black uppercase tracking-wider shadow-[0_0_15px_rgba(225,29,72,0.4)] hover:scale-105 transition">लॉगिन</button>
      <button onclick="openProfileModal()" id="userProfileBtn" class="hidden flex items-center gap-2 px-2 py-1 rounded-xl glass-panel hover:bg-slate-700 transition">
        <img id="headerUserAvatar" src="" class="w-7 h-7 rounded-full object-cover border border-slate-600">
        <span id="headerUserName" class="hidden sm:block max-w-[70px] truncate text-xs font-bold text-slate-200"></span>
      </button>
    </div>
  </header>

  <!-- ================= MAIN CONTENT AREA ================= -->
  <main class="flex-1 overflow-hidden relative flex flex-col pb-20 z-10">

    <!-- 1. HOME VIEW -->
    <div id="homeScreen" class="flex-1 overflow-y-auto p-4 max-w-lg w-full mx-auto space-y-5 pb-6">
      
      <!-- ✨ NEW: STORIES SECTION ✨ -->
      <div class="glass-panel p-3 rounded-3xl">
        <div class="flex gap-4 overflow-x-auto no-scrollbar items-center" id="storiesContainer">
          <!-- Add Story Btn -->
          <div class="flex flex-col items-center gap-1 shrink-0 cursor-pointer" onclick="document.getElementById('storyMediaInput').click()">
            <div class="w-14 h-14 rounded-full border-2 border-dashed border-slate-500 flex items-center justify-center bg-slate-800 text-slate-400 hover:border-rose-500 hover:text-rose-500 transition"><span class="text-2xl">+</span></div>
            <span class="text-[10px] font-bold text-slate-400">Add Story</span>
            <input type="file" id="storyMediaInput" accept="image/*" class="hidden" onchange="uploadStory(event)">
          </div>
          <!-- Dynamic Stories will load here -->
        </div>
      </div>

      <!-- MAIN ACTION BUTTONS -->
      <div class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <!-- Text Chat -->
          <button onclick="startApp('text')" class="glass-panel glass-card p-4 rounded-3xl text-left flex flex-col justify-between min-h-[140px]">
            <div class="w-12 h-12 rounded-2xl bg-cyan-500/20 border border-cyan-500/30 text-cyan-400 flex items-center justify-center text-2xl shadow-[0_0_15px_rgba(6,182,212,0.2)]">💬</div>
            <div class="mt-4"><h2 class="text-sm font-black text-white">टेक्स्ट चैट</h2><p class="text-[10px] text-slate-400 mt-1">अनाम चैट व 10s वैनिश</p></div>
          </button>
          <!-- Video Call -->
          <button onclick="startApp('video')" class="glass-panel glass-card p-4 rounded-3xl text-left flex flex-col justify-between min-h-[140px]">
            <div class="w-12 h-12 rounded-2xl bg-rose-500/20 border border-rose-500/30 text-rose-400 flex items-center justify-center text-2xl shadow-[0_0_15px_rgba(225,29,72,0.2)]">📹</div>
            <div class="mt-4"><h2 class="text-sm font-black text-white">वीडियो कॉल</h2><p class="text-[10px] text-slate-400 mt-1">प्रीमियम रैंडम मैच</p></div>
          </button>
        </div>

        <!-- ✨ NEW: AUDIO ROOM ✨ -->
        <button onclick="startApp('audio')" class="w-full glass-panel glass-card p-4 rounded-3xl flex items-center justify-between group overflow-hidden relative">
          <div class="flex items-center gap-4 relative z-10">
            <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-2xl shadow-[0_0_15px_rgba(16,185,129,0.2)]">🎙️</div>
            <div class="text-left"><h2 class="text-sm font-black text-white">ऑडियो रूम</h2><p class="text-[10px] text-slate-400 mt-1">बिना कैमरा दिखाए आवाज़ में बातें</p></div>
          </div>
          <span class="text-emerald-400 text-sm font-bold relative z-10">Play ➔</span>
        </button>
      </div>

      <!-- Nearby / Friends Shortcut -->
      <div class="grid grid-cols-2 gap-3">
        <button onclick="switchMainTab('nearby')" class="glass-panel glass-card p-3 rounded-2xl flex items-center justify-center gap-2"><span class="text-lg">📍</span><span class="text-xs font-bold text-slate-300">आसपास</span></button>
        <button onclick="switchMainTab('friends')" class="glass-panel glass-card p-3 rounded-2xl flex items-center justify-center gap-2"><span class="text-lg">👥</span><span class="text-xs font-bold text-slate-300">दोस्त</span></button>
      </div>
    </div>

    <!-- 2. ROOM SCREEN (Text, Video, Audio + 🎮 Game) -->
    <div id="roomScreen" class="hidden flex-1 flex flex-col overflow-hidden bg-[#020617] z-30 h-full">
      <header class="px-4 py-3 glass-panel border-b-0 rounded-b-3xl flex justify-between items-center shrink-0 mb-2">
        <div class="flex items-center gap-3">
          <button onclick="goHome()" class="p-2 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700">←</button>
          <span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full font-bold border border-emerald-500/30 flex items-center gap-1.5 shadow-[0_0_10px_rgba(16,185,129,0.2)]">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span><span id="globalOnlineCountUI">0</span> Active
          </span>
        </div>
        <div class="flex items-center gap-2">
          <!-- Game Request Button -->
          <button onclick="inviteGame()" class="px-2 py-1.5 rounded-xl glass-panel text-amber-400 text-xs font-bold" title="Play Game">🎮</button>
          <button onclick="nextPartner()" class="px-4 py-1.5 rounded-xl bg-gradient-to-r from-rose-500 to-indigo-500 text-white text-xs font-bold shadow-[0_0_10px_rgba(225,29,72,0.3)] hover:scale-105 transition">Next ➔</button>
        </div>
      </header>

      <main class="flex-1 flex flex-col overflow-hidden p-2 gap-2.5 min-h-0">
        <!-- Visual Section (Video or Audio) -->
        <section id="visualSection" class="hidden shrink-0 flex justify-center items-center gap-2.5 w-full">
          
          <!-- Remote Side -->
          <div class="flex-1 passport-video-card flex flex-col items-center justify-center relative">
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10 opacity-[0.15] select-none"><h1 class="text-4xl sm:text-5xl font-black text-white transform -rotate-45 tracking-widest drop-shadow-lg">SUKOON</h1></div><video id="remoteVideo" autoplay playsinline class="video-feed hidden"></video>
            <!-- Audio Avatar Mode -->
            <div id="remoteAudioAvatar" class="hidden flex-col items-center justify-center w-full h-full bg-slate-800">
              <div class="relative audio-pulse"><div class="w-20 h-20 bg-emerald-600 rounded-full flex items-center justify-center text-3xl shadow-[0_0_30px_rgba(16,185,129,0.5)]">🎧</div></div>
            </div>
            <span class="absolute top-2 left-2 text-[9px] bg-black/60 backdrop-blur px-2 py-0.5 rounded-md text-white font-bold tracking-wider">STRANGER</span>
            <div id="videoWaitingNotice" class="absolute inset-0 flex flex-col items-center justify-center text-center p-2 bg-slate-900/90 backdrop-blur z-20">
              <div class="w-8 h-8 rounded-full border-2 border-rose-500 border-t-transparent animate-spin mb-2"></div>
              <span class="text-[10px] text-slate-300 font-bold uppercase tracking-widest">Searching...</span>
            </div>
          </div>

          <!-- Local Side -->
          <div class="flex-1 passport-video-card flex flex-col items-center justify-center relative">
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10 opacity-[0.15] select-none"><h1 class="text-4xl sm:text-5xl font-black text-white transform -rotate-45 tracking-widest drop-shadow-lg">SUKOON</h1></div><video id="localVideo" autoplay playsinline muted class="video-feed hidden"></video>
            <!-- Audio Avatar Mode -->
            <div id="localAudioAvatar" class="hidden flex-col items-center justify-center w-full h-full bg-slate-800">
              <div class="relative"><div class="w-20 h-20 bg-indigo-600 rounded-full flex items-center justify-center text-3xl shadow-[0_0_30px_rgba(79,70,229,0.5)]">😎</div></div>
            </div>
            <span class="absolute top-2 left-2 text-[9px] bg-black/60 backdrop-blur px-2 py-0.5 rounded-md text-white font-bold tracking-wider">YOU</span>
            <div class="absolute bottom-2 inset-x-2 flex justify-center gap-1.5 z-10">
              <button onclick="toggleAudio()" id="micBtn" class="p-2 rounded-xl bg-black/60 backdrop-blur border border-white/10 text-white text-xs shadow-md">🎙️</button>
              <button onclick="toggleVideo()" id="camBtn" class="p-2 rounded-xl bg-black/60 backdrop-blur border border-white/10 text-white text-xs shadow-md hidden">📹</button>
            </div>
          </div>
        </section>

        <!-- Chat Box -->
        <section class="flex-1 flex flex-col rounded-3xl glass-panel overflow-hidden min-h-0 relative">
          
          <!-- Mini Game Overlay (Tic Tac Toe) -->
          <div id="gameOverlay" class="hidden absolute inset-0 bg-slate-900/95 backdrop-blur-md z-30 flex flex-col items-center justify-center p-4">
            <h3 class="text-cyan-400 font-black tracking-widest mb-2">TIC-TAC-TOE</h3>
            <div id="gameStatus" class="text-xs text-white mb-4">आपकी बारी (X)</div>
            <div class="game-grid" id="ticTacToeBoard"></div>
            <button onclick="closeGame()" class="mt-6 px-4 py-2 bg-rose-600 rounded-xl text-xs font-bold text-white shadow-md">Quit Game</button>
          </div>

          <div id="messagesBox" class="flex-1 overflow-y-auto p-3 space-y-2.5 stream-chat-scroll text-xs">
            <div class="text-center py-2 text-[10px] text-slate-500 font-medium uppercase tracking-widest">🔒 Premium Secure Chat</div>
          </div>
          <form id="chatForm" onsubmit="handleSendSubmit(event)" class="p-2 border-t border-slate-700/50 bg-slate-800/50 flex items-center gap-2 shrink-0">
            <input type="text" id="msgInput" autocomplete="off" placeholder="Message..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-rose-500">
            <button type="submit" class="px-4 py-2.5 bg-rose-600 text-white font-bold rounded-xl text-xs shadow-lg">Send</button>
          </form>
        </section>
      </main>
    </div>

    <!-- Note: Skipping full HTML for Feed/Nearby to fit tokens, using JS to toggle displays -->
    <div id="feedScreen" class="hidden flex-1 overflow-y-auto p-4 max-w-lg w-full mx-auto pb-6 text-white text-center"><br><br>Feed Area</div>
    <div id="nearbyHubScreen" class="hidden flex-1 overflow-y-auto p-4 max-w-lg w-full mx-auto pb-6 text-white text-center"><br><br>Nearby Area</div>
    <div id="connectionsHubScreen" class="hidden flex-1 overflow-y-auto p-4 max-w-lg w-full mx-auto pb-6 text-white text-center"><br><br>Friends Area</div>
    
  </main>

  <!-- ================= FLOATING ISLAND DOCK (Premium iOS Style) ================= -->
  <nav class="fixed bottom-4 left-1/2 transform -translate-x-1/2 nav-island px-4 py-2 flex justify-between items-center z-40 w-[90%] max-w-sm shadow-2xl">
    <button onclick="switchMainTab('home')" class="flex flex-col items-center group">
      <div id="dock-home" class="nav-circle-btn active text-lg">🏠</div>
    </button>
    <button onclick="switchMainTab('feed')" class="flex flex-col items-center group">
      <div id="dock-feed" class="nav-circle-btn text-lg hover:text-white">📸</div>
    </button>
    <button class="w-12 h-12 rounded-full bg-gradient-to-tr from-rose-500 to-indigo-500 text-white flex items-center justify-center text-2xl shadow-[0_0_20px_rgba(225,29,72,0.5)] border-2 border-slate-900 active:scale-95 transition">
      <span>➕</span>
    </button>
    <button onclick="switchMainTab('nearby')" class="flex flex-col items-center group">
      <div id="dock-nearby" class="nav-circle-btn text-lg hover:text-white">📍</div>
    </button>
    <button onclick="switchMainTab('friends')" class="flex flex-col items-center group">
      <div id="dock-friends" class="nav-circle-btn text-lg hover:text-white">👥</div>
    </button>
  </nav>

  <!-- Full Screen Story Viewer Overlay -->
  <div id="storyViewer" class="hidden fixed inset-0 bg-black z-50 flex flex-col">
    <div class="h-1 bg-slate-700 w-full"><div id="storyProgress" class="h-full bg-rose-500 w-0 transition-all duration-[5000ms] ease-linear"></div></div>
    <div class="flex items-center p-4 gap-3 bg-gradient-to-b from-black/80 to-transparent absolute top-1 w-full z-10">
      <img id="viewStoryAvatar" src="" class="w-10 h-10 rounded-full border-2 border-rose-500">
      <span id="viewStoryName" class="text-white font-bold text-sm"></span>
      <button onclick="closeStory()" class="ml-auto text-white text-xl">✕</button>
    </div>
    <img id="viewStoryImg" src="" class="w-full h-full object-contain">
  </div>

  <script>
    let socket; let currentMode = 'text'; let localStream = null; let peerConnection = null; let isInitiator = false;
    let isMuted = false; let isCamOff = false; let loggedInUser = null;
    const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
    let stories = [];

    window.addEventListener("load", () => { initSocket(); loadStories(); });

    // 🔥 CAMERA CLEANUP BUG FIX MAINTAINED 🔥
    function switchMainTab(tab) {
      if (tab !== 'room') { goHome(false); }
      ['homeScreen', 'feedScreen', 'nearbyHubScreen', 'connectionsHubScreen', 'roomScreen'].forEach(s => document.getElementById(s).classList.add('hidden'));
      ['home', 'feed', 'nearby', 'friends'].forEach(t => { const el = document.getElementById(`dock-${t}`); if(el) el.classList.remove('active'); });
      if(tab==='home') { document.getElementById('homeScreen').classList.remove('hidden'); document.getElementById('dock-home').classList.add('active'); loadStories(); }
      // Mock toggling for brevity
    }

    function initSocket() {
      if(socket) return; socket = io();
      socket.on("global_online_count", (c) => { const el=document.getElementById("globalOnlineCountUI"); if(el) el.innerText = c||0; });
      socket.on("partner_found", (data) => {
        isInitiator = data.isInitiator; document.getElementById("videoWaitingNotice").classList.add("hidden");
        appendSystemMessage(data.partnerName ? `${data.partnerName} Connected!` : "Stranger Connected!");
        if (currentMode === 'video' || currentMode === 'audio') initRandomPeerConnection();
      });
      socket.on("receive_message", ({ text }) => appendMessage(text, "partner"));
      socket.on("partner_disconnected", () => { document.getElementById("videoWaitingNotice").classList.remove("hidden"); closePeer(); appendSystemMessage("Stranger Left."); resetGame(); });
      socket.on("webrtc_signal", async (sig) => {
        if(!peerConnection) return;
        if(sig.sdp) { await peerConnection.setRemoteDescription(new RTCSessionDescription(sig.sdp)); if(sig.sdp.type==="offer"){ const ans = await peerConnection.createAnswer(); await peerConnection.setLocalDescription(ans); socket.emit("webrtc_signal", {sdp: peerConnection.localDescription}); } }
        else if(sig.candidate) { await peerConnection.addIceCandidate(new RTCIceCandidate(sig.candidate)); }
      });
      socket.on("new_story", (s) => { stories.unshift(s); renderStories(); });
      
      // Game Logic Sockets
      socket.on("game_invite_received", () => { if(confirm("Stranger invited you to play Tic-Tac-Toe! Accept?")) { socket.emit("game_accept"); startGame(false); } });
      socket.on("game_started", () => { startGame(true); });
      socket.on("game_move_received", (idx) => { applyGameMove(idx, 'O'); });
    }

    // STORIES LOGIC
    async function loadStories() { try{ const res = await fetch("/api/stories"); const d = await res.json(); stories = d.stories||[]; renderStories(); }catch(e){} }
    function renderStories() {
      const box = document.getElementById("storiesContainer");
      // Keep the "Add" button, remove others
      box.innerHTML = `<div class="flex flex-col items-center gap-1 shrink-0 cursor-pointer" onclick="document.getElementById('storyMediaInput').click()"><div class="w-14 h-14 rounded-full border-2 border-dashed border-slate-500 flex items-center justify-center bg-slate-800 text-slate-400 hover:border-rose-500 hover:text-rose-500 transition"><span class="text-2xl">+</span></div><span class="text-[10px] font-bold text-slate-400">Add Story</span><input type="file" id="storyMediaInput" accept="image/*" class="hidden" onchange="uploadStory(event)"></div>` 
      + stories.map((s, i) => `
        <div class="flex flex-col items-center gap-1 shrink-0 cursor-pointer" onclick="viewStory(${i})">
          <div class="story-ring"><img src="${s.authorAvatar}" class="w-12 h-12 story-img"></div>
          <span class="text-[10px] font-bold text-slate-300 w-14 truncate text-center flex items-center justify-center">${s.authorName} ${s.isPremium?'<span class="text-yellow-400 text-[8px] ml-0.5">👑</span>':''}</span>
        </div>
      `).join("");
    }
    function uploadStory(e) {
      if(!loggedInUser) return alert("लॉगिन करें!"); const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader(); reader.onload = async (ev) => {
        try { await fetch("/api/stories/create", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({email:loggedInUser.email, media:ev.target.result}) }); alert("Story Uploaded!"); } catch(err){}
      }; reader.readAsDataURL(file);
    }
    let storyTimer;
    function viewStory(idx) {
      const s = stories[idx]; if(!s) return;
      document.getElementById('viewStoryImg').src = s.media; document.getElementById('viewStoryAvatar').src = s.authorAvatar; document.getElementById('viewStoryName').innerText = s.authorName;
      document.getElementById('storyViewer').classList.remove('hidden');
      const prog = document.getElementById('storyProgress'); prog.style.width = '0%'; setTimeout(()=>prog.style.width = '100%', 50);
      clearTimeout(storyTimer); storyTimer = setTimeout(closeStory, 5000);
    }
    function closeStory() { document.getElementById('storyViewer').classList.add('hidden'); clearTimeout(storyTimer); }

    // ROOM LOGIC (Audio / Video)
    async function startApp(mode) {
      currentMode = mode; document.getElementById('homeScreen').classList.add('hidden'); document.getElementById('roomScreen').classList.remove('hidden');
      if (mode === 'video' || mode === 'audio') {
        document.getElementById('visualSection').classList.remove('hidden');
        if(mode==='video') { document.getElementById('camBtn').classList.remove('hidden'); document.getElementById('localVideo').classList.remove('hidden'); document.getElementById('remoteVideo').classList.remove('hidden'); document.getElementById('localAudioAvatar').classList.add('hidden'); document.getElementById('remoteAudioAvatar').classList.add('hidden'); }
        if(mode==='audio') { document.getElementById('camBtn').classList.add('hidden'); document.getElementById('localVideo').classList.add('hidden'); document.getElementById('remoteVideo').classList.add('hidden'); document.getElementById('localAudioAvatar').classList.remove('hidden'); document.getElementById('localAudioAvatar').classList.add('flex'); document.getElementById('remoteAudioAvatar').classList.remove('hidden'); document.getElementById('remoteAudioAvatar').classList.add('flex'); }
        await startMedia();
      } else { document.getElementById('visualSection').classList.add('hidden'); }
      socket.emit("find_partner", { mode });
    }

    async function startMedia() {
      try {
        if(localStream) localStream.getTracks().forEach(t=>t.stop());
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: currentMode === 'video' });
        if(currentMode==='video') document.getElementById('localVideo').srcObject = localStream;
      } catch(e) { alert("Mic/Cam Permission required!"); goHome(true); }
    }

    function initRandomPeerConnection() {
      closePeer(); peerConnection = new RTCPeerConnection(rtcConfig);
      if(localStream) localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
      peerConnection.ontrack = (event) => { 
        if(currentMode==='video') document.getElementById('remoteVideo').srcObject = event.streams[0]; 
        else { const audioEl = new Audio(); audioEl.srcObject = event.streams[0]; audioEl.play(); } // Audio only
      };
      peerConnection.onicecandidate = (e) => { if(e.candidate) socket.emit("webrtc_signal", { candidate: e.candidate }); };
      if(isInitiator) { peerConnection.createOffer().then(o => { peerConnection.setLocalDescription(o); socket.emit("webrtc_signal", { sdp: o }); }); }
    }
    function closePeer() { if(peerConnection) { peerConnection.close(); peerConnection = null; } document.getElementById('remoteVideo').srcObject = null; }

    function handleSendSubmit(e) { e.preventDefault(); const inp = document.getElementById('msgInput'); const txt = inp.value.trim(); if(!txt||!socket) return; socket.emit("send_message", {text:txt}); appendMessage(txt, "me"); inp.value=""; }
    function appendMessage(text, who) { const box = document.getElementById("messagesBox"); const div = document.createElement("div"); div.className = who==="me"?"flex justify-end":"flex justify-start"; div.innerHTML = `<div class="max-w-[80%] px-4 py-2 rounded-2xl text-xs ${who==='me'?'bg-rose-600 text-white':'bg-slate-800 text-slate-200'}"><p>${text}</p></div>`; box.appendChild(div); box.scrollTop = box.scrollHeight; }
    function appendSystemMessage(msg) { const box = document.getElementById("messagesBox"); const div = document.createElement("div"); div.className = "text-center my-1"; div.innerHTML = `<span class="text-[10px] bg-slate-800 border border-slate-700 px-3 py-1 rounded-full text-slate-400">${msg}</span>`; box.appendChild(div); }
    function nextPartner() { closePeer(); document.getElementById("messagesBox").innerHTML = ""; document.getElementById("videoWaitingNotice").classList.remove("hidden"); resetGame(); if(socket) socket.emit("find_partner", {mode:currentMode}); }
    
    // SAFE CLEANUP
    function goHome(nav=true) { closePeer(); if(localStream) { localStream.getTracks().forEach(t=>t.stop()); localStream=null; } if(socket) socket.emit("leave_chat"); document.getElementById('messagesBox').innerHTML=''; resetGame(); if(nav) switchMainTab('home'); }
    function toggleAudio() { if(!localStream) return; isMuted=!isMuted; localStream.getAudioTracks().forEach(t=>t.enabled=!isMuted); document.getElementById('micBtn').innerText = isMuted?"🔇":"🎙️"; }
    function toggleVideo() { if(!localStream || currentMode!=='video') return; isCamOff=!isCamOff; localStream.getVideoTracks().forEach(t=>t.enabled=!isCamOff); document.getElementById('camBtn').innerText = isCamOff?"🚫":"📹"; }

    // 🎮 MINI GAME (Tic-Tac-Toe)
    let board=['','','','','','','','','']; let myMark='X'; let isMyTurn=false; let gameActive=false;
    function inviteGame() { if(socket) { socket.emit("game_invite"); appendSystemMessage("Game invite sent..."); } }
    function startGame(initiator) {
      document.getElementById('gameOverlay').classList.remove('hidden'); gameActive = true; board=['','','','','','','','','']; myMark = initiator?'X':'O'; isMyTurn = initiator;
      updateBoardUI(); updateGameStatus();
    }
    function updateGameStatus() { document.getElementById('gameStatus').innerText = isMyTurn ? `आपकी बारी (${myMark})` : "Opponent's Turn..."; }
    function updateBoardUI() {
      const grid = document.getElementById('ticTacToeBoard'); grid.innerHTML = '';
      board.forEach((cell, i) => {
        const d = document.createElement('div'); d.className = `game-cell ${cell==='X'?'text-rose-500':'text-cyan-500'}`; d.innerText = cell;
        d.onclick = () => { if(isMyTurn && gameActive && board[i]==='') { board[i]=myMark; isMyTurn=false; updateBoardUI(); updateGameStatus(); socket.emit("game_move", i); checkWin(); } };
        grid.appendChild(d);
      });
    }
    function applyGameMove(idx) { if(board[idx]==='') { board[idx] = myMark==='X'?'O':'X'; isMyTurn=true; updateBoardUI(); updateGameStatus(); checkWin(); } }
    function checkWin() {
      const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      for(let w of wins) { if(board[w[0]] && board[w[0]]===board[w[1]] && board[w[0]]===board[w[2]]) { document.getElementById('gameStatus').innerText = `${board[w[0]]} Wins! 🎉`; gameActive=false; return; } }
      if(!board.includes('')) { document.getElementById('gameStatus').innerText = "Draw! 🤝"; gameActive=false; }
    }
    function closeGame() { document.getElementById('gameOverlay').classList.add('hidden'); gameActive=false; }
    function resetGame() { closeGame(); }
  </script>

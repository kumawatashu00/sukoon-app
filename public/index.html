<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sukoon - Social, Live & Chat</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#fdf2f8">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* ✨ LIGHT PINK THEME (यूज़र की डिमांड) ✨ */
    body { background-color: #fdf2f8; color: #1e293b; } /* bg-pink-50 */
    .app-screen { height: 100vh; height: 100dvh; height: -webkit-fill-available; }
    
    .panel-card { background: #ffffff; border: 1px solid #bfdbfe; border-radius: 1.5rem; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.1); transition: all 0.2s; }
    .panel-card:hover { border-color: #60a5fa; box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.2); transform: translateY(-2px); }

    .btn-blue { background: linear-gradient(to right, #2563eb, #3b82f6); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
    .btn-blue:hover { opacity: 0.9; transform: scale(1.02); }

    /* Stories UI */
    .story-ring { background: linear-gradient(45deg, #3b82f6, #ec4899); padding: 2.5px; border-radius: 50%; display: inline-block; }
    .story-img { border: 2px solid #ffffff; border-radius: 50%; object-fit: cover; }
    
    /* Video Room */
    .passport-video-card { aspect-ratio: 3/4; height: 230px; max-height: 38vh; border-radius: 1.25rem; overflow: hidden; position: relative; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); }
    @media (min-width: 640px) { .passport-video-card { height: 280px; } }
    .video-feed { background: #0f172a; object-fit: cover; width: 100%; height: 100%; }

    /* Audio Pulse */
    @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.5); opacity: 0; } }
    .audio-pulse::before { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid #3b82f6; animation: pulse-ring 2s infinite; }

    /* Bottom Nav */
    .nav-circle-btn { width: 44px; height: 44px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; color: #64748b; }
    .nav-circle-btn.active { background: #eff6ff; color: #2563eb; transform: translateY(-4px); box-shadow: 0 4px 10px rgba(37,99,235,0.2); }

    /* Mini Game */
    .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; background: rgba(0,0,0,0.1); padding: 5px; border-radius: 10px; width: 200px; margin: 10px auto; }
    .game-cell { background: #ffffff; height: 60px; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; cursor: pointer; border-radius: 6px; border: 1px solid #e2e8f0;}
    
    .stream-chat-scroll::-webkit-scrollbar { width: 4px; }
    .stream-chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="font-sans app-screen flex flex-col overflow-hidden relative">

  <!-- ================= TOP HEADER (Light) ================= -->
  <header class="px-4 py-3 bg-white/90 backdrop-blur-md border-b border-pink-100 flex justify-between items-center shrink-0 z-20 sticky top-0 shadow-sm">
    <div class="flex items-center gap-2 cursor-pointer" onclick="switchMainTab('home')">
      <div class="w-9 h-9 rounded-xl btn-blue flex items-center justify-center text-lg">🌿</div>
      <div>
        <h1 class="text-sm font-black tracking-widest text-blue-900 leading-none">SUKOON</h1>
        <span class="text-[9px] text-pink-500 font-bold uppercase tracking-widest">Premium Social</span>
      </div>
    </div>
    <div id="authContainer" class="flex items-center gap-2">
      <button onclick="toggleAuthModal()" id="authNavBtn" class="px-4 py-1.5 rounded-xl btn-blue text-xs font-black uppercase tracking-wider">लॉगिन</button>
      <button onclick="openProfileModal()" id="userProfileBtn" class="hidden flex items-center gap-2 px-2 py-1 rounded-xl bg-blue-50 hover:bg-blue-100 border border-blue-200 transition">
        <img id="headerUserAvatar" src="" class="w-6 h-6 rounded-full object-cover">
        <span id="headerUserName" class="hidden sm:block max-w-[70px] truncate text-xs font-bold text-blue-900"></span>
      </button>
    </div>
  </header>

  <!-- ================= MAIN CONTENT AREA ================= -->
  <main class="flex-1 overflow-hidden relative flex flex-col pb-20 z-10">

    <!-- 1. HOME VIEW -->
    <div id="homeScreen" class="flex-1 overflow-y-auto p-4 max-w-lg w-full mx-auto space-y-4 pb-6">
      
      <!-- STORIES -->
      <div class="panel-card p-3">
        <div class="flex gap-4 overflow-x-auto no-scrollbar items-center" id="storiesContainer"></div>
      </div>

      <!-- MAIN ACTION BUTTONS -->
      <div class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <button onclick="startApp('text')" class="panel-card p-4 text-left flex flex-col justify-between min-h-[130px]">
            <div class="w-10 h-10 rounded-2xl bg-cyan-100 text-cyan-600 flex items-center justify-center text-xl">💬</div>
            <div class="mt-2"><h2 class="text-sm font-black text-slate-800">टेक्स्ट चैट</h2><p class="text-[10px] text-slate-500 mt-1">अनाम चैट</p></div>
          </button>
          <button onclick="startApp('video')" class="panel-card p-4 text-left flex flex-col justify-between min-h-[130px]">
            <div class="w-10 h-10 rounded-2xl bg-pink-100 text-pink-600 flex items-center justify-center text-xl">📹</div>
            <div class="mt-2"><h2 class="text-sm font-black text-slate-800">वीडियो कॉल</h2><p class="text-[10px] text-slate-500 mt-1">रैंडम मैच</p></div>
          </button>
        </div>

        <!-- NEW: AUDIO ROOM -->
        <button onclick="startApp('audio')" class="w-full panel-card p-4 flex items-center justify-between group overflow-hidden">
          <div class="flex items-center gap-3 relative z-10">
            <div class="w-10 h-10 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl">🎙️</div>
            <div class="text-left"><h2 class="text-sm font-black text-slate-800">ऑडियो रूम</h2><p class="text-[10px] text-slate-500 mt-0.5">बिना कैमरा दिखाए बात करें</p></div>
          </div>
          <span class="text-blue-600 text-sm font-bold relative z-10">➔</span>
        </button>

        <!-- LIVE STREAM HUB -->
        <button onclick="openStreamHub()" class="w-full panel-card p-4 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-xl">📡</div>
            <div class="text-left">
              <div class="flex items-center gap-1.5"><h2 class="text-sm font-black text-slate-800">क्रिएटर लाइव</h2><span class="text-[9px] bg-red-500 text-white px-2 rounded-full font-bold">LIVE</span></div>
              <p class="text-[10px] text-slate-500 mt-0.5">लाइव चैट व गिफ़्ट्स</p>
            </div>
          </div>
          <span class="text-blue-600 text-sm font-bold">➔</span>
        </button>
      </div>

      <!-- Nearby / Friends -->
      <div class="grid grid-cols-2 gap-3">
        <button onclick="switchMainTab('nearby')" class="panel-card p-3 flex items-center justify-center gap-2"><span class="text-lg">📍</span><span class="text-xs font-bold text-slate-700">आसपास</span></button>
        <button onclick="switchMainTab('friends')" class="panel-card p-3 flex items-center justify-center gap-2"><span class="text-lg">👥</span><span class="text-xs font-bold text-slate-700">दोस्त</span></button>
      </div>
    </div>

    <!-- 2. ROOM SCREEN (Text, Video, Audio + Game + Watermark) -->
    <div id="roomScreen" class="hidden flex-1 flex flex-col overflow-hidden bg-slate-900 z-30 h-full">
      <header class="px-3 py-2 bg-slate-800 border-b border-slate-700 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2">
          <button onclick="goHome()" class="p-1.5 rounded-xl bg-slate-700 text-white">←</button>
          <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-bold flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span><span id="globalOnlineCountUI">0</span> Active</span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="inviteGame()" class="px-2 py-1.5 rounded-xl bg-slate-700 text-amber-400 text-xs font-bold">🎮 Play</button>
          <button onclick="nextPartner()" class="px-3 py-1.5 rounded-xl btn-blue text-xs font-bold">Next ➔</button>
        </div>
      </header>

      <main class="flex-1 flex flex-col overflow-hidden p-2 gap-2 min-h-0">
        <!-- Visual Section -->
        <section id="visualSection" class="hidden shrink-0 flex justify-center items-center gap-2 w-full">
          <!-- Remote -->
          <div class="flex-1 passport-video-card flex flex-col items-center justify-center relative">
            <!-- ✨ SUKOON WATERMARK ✨ -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10 opacity-[0.2] select-none"><h1 class="text-4xl sm:text-5xl font-black text-white transform -rotate-45 tracking-widest drop-shadow-lg">SUKOON</h1></div>
            
            <video id="remoteVideo" autoplay playsinline class="video-feed hidden"></video>
            <div id="remoteAudioAvatar" class="hidden flex-col items-center justify-center w-full h-full bg-slate-800"><div class="relative audio-pulse"><div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center text-3xl">🎧</div></div></div>
            <span class="absolute top-2 left-2 text-[9px] bg-black/60 px-2 py-0.5 rounded-md text-white font-bold z-20">STRANGER</span>
            <div id="videoWaitingNotice" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-30"><div class="w-6 h-6 rounded-full border-2 border-blue-500 border-t-transparent animate-spin mb-1"></div><span class="text-[9px] text-slate-300">Searching...</span></div>
          </div>
          <!-- Local -->
          <div class="flex-1 passport-video-card flex flex-col items-center justify-center relative">
            <!-- ✨ SUKOON WATERMARK ✨ -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10 opacity-[0.2] select-none"><h1 class="text-4xl sm:text-5xl font-black text-white transform -rotate-45 tracking-widest drop-shadow-lg">SUKOON</h1></div>

            <video id="localVideo" autoplay playsinline muted class="video-feed hidden"></video>
            <div id="localAudioAvatar" class="hidden flex-col items-center justify-center w-full h-full bg-slate-800"><div class="relative"><div class="w-16 h-16 bg-pink-600 rounded-full flex items-center justify-center text-3xl">😎</div></div></div>
            <span class="absolute top-2 left-2 text-[9px] bg-black/60 px-2 py-0.5 rounded-md text-white font-bold z-20">YOU</span>
            <div class="absolute bottom-2 inset-x-2 flex justify-center gap-1.5 z-20">
              <button onclick="toggleAudio()" id="micBtn" class="p-1.5 rounded-xl bg-black/60 text-white text-xs">🎙️</button>
              <button onclick="toggleVideo()" id="camBtn" class="p-1.5 rounded-xl bg-black/60 text-white text-xs hidden">📹</button>
            </div>
          </div>
        </section>

        <!-- Chat / Game Section -->
        <section class="flex-1 flex flex-col rounded-2xl bg-white overflow-hidden min-h-0 relative">
          <!-- Game Overlay -->
          <div id="gameOverlay" class="hidden absolute inset-0 bg-white/95 backdrop-blur z-30 flex flex-col items-center justify-center p-4">
            <h3 class="text-blue-600 font-black mb-2">TIC-TAC-TOE</h3>
            <div id="gameStatus" class="text-xs text-slate-800 mb-2">आपकी बारी (X)</div>
            <div class="game-grid" id="ticTacToeBoard"></div>
            <button onclick="closeGame()" class="mt-4 px-4 py-2 bg-pink-500 rounded-xl text-xs font-bold text-white">Quit</button>
          </div>
          <div id="messagesBox" class="flex-1 overflow-y-auto p-2 space-y-2 stream-chat-scroll text-xs"><div class="text-center py-2 text-[10px] text-slate-400">🔒 Secure Chat</div></div>
          <form id="chatForm" onsubmit="handleSendSubmit(event)" class="p-2 border-t border-slate-100 bg-slate-50 flex gap-2 shrink-0">
            <input type="text" id="msgInput" autocomplete="off" placeholder="Message..." class="flex-1 bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-blue-500">
            <button type="submit" class="px-4 py-2 btn-blue font-bold rounded-xl text-xs">Send</button>
          </form>
        </section>
      </main>
    </div>

    <!-- 3. FEED SCREEN (RESTORED) -->
    <div id="feedScreen" class="hidden flex-1 overflow-y-auto p-4 max-w-lg w-full mx-auto space-y-3 pb-6">
      <div class="flex justify-between items-center pb-2 border-b border-pink-100">
        <h2 class="text-base font-black text-blue-900">📸 कम्युनिटी फ़ीड</h2>
        <button onclick="openCreatePostModal()" class="px-3 py-1 btn-blue text-xs font-bold rounded-xl">+ नया पोस्ट</button>
      </div>
      <div id="feedPostsContainer" class="space-y-4"></div>
    </div>

    <!-- 4. STREAM HUB (RESTORED) -->
    <div id="streamHubScreen" class="hidden flex-1 flex flex-col overflow-hidden max-w-4xl w-full mx-auto p-3 pb-6">
      <header class="flex justify-between items-center pb-2 border-b border-pink-100">
        <div class="flex items-center gap-2"><button onclick="switchMainTab('home')" class="px-3 py-1 rounded-xl bg-white border border-slate-200 text-xs font-bold text-slate-700">←</button><h2 class="text-base font-black text-blue-900">📡 लाइव हब</h2></div>
        <button onclick="startBroadcasting()" id="startBroadcastBtn" class="hidden px-3 py-1.5 btn-blue text-xs font-bold rounded-xl">🔴 Go Live</button>
      </header>
      <!-- Stream Player -->
      <div id="activeStreamPlayer" class="hidden flex-1 flex flex-col md:flex-row gap-2 mt-2 min-h-0">
        <div class="relative flex-1 rounded-3xl overflow-hidden bg-black flex items-center justify-center min-h-[200px]">
          <video id="streamVideoPlayer" autoplay playsinline class="w-full h-full object-cover"></video>
          <div class="absolute top-2 left-2 bg-red-600 text-white px-2 py-0.5 rounded-full text-[10px] font-bold">LIVE</div>
          <div class="absolute top-2 right-2 flex gap-1 z-20">
            <button onclick="leaveCurrentStream()" id="viewerCloseStreamBtn" class="hidden bg-white/80 px-2 py-1 rounded-xl text-xs font-bold">✕ Close</button>
            <button onclick="stopBroadcast()" id="streamerStopBtn" class="hidden bg-red-600 text-white px-2 py-1 rounded-xl text-xs font-bold">⏹️ End</button>
          </div>
        </div>
        <div class="w-full md:w-80 h-48 md:h-auto bg-white border border-slate-200 rounded-3xl flex flex-col shadow-sm">
          <div class="px-3 py-2 border-b border-slate-100 bg-slate-50"><span class="text-xs font-bold text-slate-700">💬 चैट</span></div>
          <div id="streamChatMessagesBox" class="flex-1 overflow-y-auto p-2 space-y-1 text-xs"></div>
          <form onsubmit="handleSendStreamChat(event)" class="p-2 border-t border-slate-100 bg-slate-50 flex gap-1">
            <input type="text" id="streamChatInput" placeholder="कमेंट..." class="flex-1 bg-white border border-slate-200 rounded-xl px-2 py-1 text-xs outline-none">
            <button type="submit" class="px-2 py-1 btn-blue rounded-xl text-xs">Send</button>
          </form>
        </div>
      </div>
      <!-- Stream List -->
      <div id="streamsListWrapper" class="flex-1 overflow-y-auto mt-2">
        <div id="streamsListContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
      </div>
    </div>

    <!-- 5. NEARBY -->
    <div id="nearbyHubScreen" class="hidden flex-1 overflow-y-auto p-4 max-w-lg w-full mx-auto space-y-3 pb-6">
      <header class="flex justify-between items-center pb-2 border-b border-pink-100"><h2 class="text-base font-black text-blue-900">📍 आसपास के लोग</h2></header>
      <div class="flex gap-1 mb-2">
        <button onclick="setNearbyRadius(25)" id="radBtn25" class="px-2 py-1 rounded-xl text-[10px] font-bold bg-white text-slate-600 border">25 KM</button>
        <button onclick="setNearbyRadius(100)" id="radBtn100" class="px-2 py-1 rounded-xl text-[10px] font-bold btn-blue">100 KM</button>
      </div>
      <div id="nearbyListContainer" class="space-y-2"></div>
    </div>
    
    <!-- 6. FRIENDS -->
    <div id="connectionsHubScreen" class="hidden flex-1 overflow-y-auto p-4 max-w-lg w-full mx-auto pb-6">
      <header class="pb-2 border-b border-pink-100"><h2 class="text-base font-black text-blue-900">👥 आपके दोस्त</h2></header>
      <div class="text-center py-10 text-xs text-slate-500">अभी कोई दोस्त नहीं है।</div>
    </div>
    
  </main>

  <!-- ================= BOTTOM DOCK (Light Theme) ================= -->
  <nav class="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur-md border-t border-pink-100 py-2 px-4 flex justify-around items-center z-40 shadow-lg">
    <button onclick="switchMainTab('home')" class="flex flex-col items-center group"><div id="dock-home" class="nav-circle-btn active text-lg">🏠</div></button>
    <button onclick="switchMainTab('feed')" class="flex flex-col items-center group"><div id="dock-feed" class="nav-circle-btn text-lg hover:bg-slate-50">📸</div></button>
    <button onclick="openCreatePostModal()" class="w-12 h-12 -mt-6 rounded-full btn-blue flex items-center justify-center text-2xl border-4 border-white active:scale-95 transition"><span>➕</span></button>
    <button onclick="switchMainTab('nearby')" class="flex flex-col items-center group"><div id="dock-nearby" class="nav-circle-btn text-lg hover:bg-slate-50">📍</div></button>
    <button onclick="switchMainTab('friends')" class="flex flex-col items-center group"><div id="dock-friends" class="nav-circle-btn text-lg hover:bg-slate-50">👥</div></button>
  </nav>

  <!-- ================= MODALS (RESTORED) ================= -->
  <!-- Auth Modal -->
  <div id="authModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white p-5 rounded-3xl w-full max-w-sm space-y-4 relative shadow-xl">
      <button onclick="toggleAuthModal()" class="absolute top-4 right-4 text-slate-400">✕</button>
      <h3 class="text-lg font-black text-blue-900 text-center">लॉगिन / साइन अप</h3>
      <input type="email" id="authEmail" placeholder="Email" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs">
      <input type="password" id="authPassword" placeholder="Password" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs">
      <button onclick="submitAuth()" class="w-full py-3 btn-blue font-bold rounded-xl text-xs">लॉगिन करें</button>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profileModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white p-5 rounded-3xl w-full max-w-sm space-y-4 relative text-center">
      <button onclick="closeProfileModal()" class="absolute top-4 right-4 text-slate-400">✕</button>
      <img id="myProfileImg" src="" class="w-20 h-20 rounded-full object-cover mx-auto border-2 border-blue-500">
      <h3 id="myProfileName" class="font-bold text-slate-800"></h3>
      <button onclick="logoutUser()" class="w-full py-2 bg-red-100 text-red-600 font-bold rounded-xl text-xs">लॉगआउट</button>
    </div>
  </div>

  <!-- Create Post Modal -->
  <div id="createPostModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white p-5 rounded-3xl w-full max-w-sm space-y-3 relative">
      <button onclick="closeCreatePostModal()" class="absolute top-4 right-4 text-slate-400">✕</button>
      <h3 class="text-sm font-black text-blue-900 text-center">नया पोस्ट</h3>
      <input type="file" id="postFileInput" accept="image/*" onchange="handlePostMedia(event)" class="text-xs bg-slate-50 p-2 border rounded-xl w-full">
      <img id="postImgPreview" src="" class="hidden w-full max-h-40 object-cover rounded-xl">
      <textarea id="postCaptionInput" placeholder="कैप्शन..." class="w-full bg-slate-50 border rounded-xl p-2 text-xs"></textarea>
      <button onclick="submitNewPost()" class="w-full py-2.5 btn-blue font-bold rounded-xl text-xs">शेयर करें</button>
    </div>
  </div>

  <!-- Story Viewer -->
  <div id="storyViewer" class="hidden fixed inset-0 bg-black z-50 flex flex-col">
    <div class="h-1 bg-slate-700 w-full"><div id="storyProgress" class="h-full bg-pink-500 w-0 transition-all duration-[5000ms] ease-linear"></div></div>
    <div class="flex items-center p-4 gap-3 bg-gradient-to-b from-black/80 to-transparent absolute top-1 w-full z-10">
      <img id="viewStoryAvatar" src="" class="w-10 h-10 rounded-full border-2 border-pink-500">
      <span id="viewStoryName" class="text-white font-bold text-sm"></span>
      <button onclick="closeStory()" class="ml-auto text-white text-xl">✕</button>
    </div>
    <img id="viewStoryImg" src="" class="w-full h-full object-contain">
  </div>

  <!-- ================= JAVASCRIPT ================= -->
  <script>
    let socket; let currentMode='text'; let localStream=null; let peerConnection=null; let isInitiator=false; let isMuted=false; let isCamOff=false; 
    let loggedInUser=null; let currentRadiusKM=100; let stories=[]; let cachedPosts=[]; let tempPostMediaBase64=null; let currentActiveStreamId=null;
    const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    window.onload = () => { initSocket(); restoreSavedUser(); loadStories(); fetchFeedPosts(); };

    // TABS
    function switchMainTab(t) {
      if(t !== 'room') goHome(false);
      ['homeScreen', 'feedScreen', 'nearbyHubScreen', 'connectionsHubScreen', 'roomScreen', 'streamHubScreen'].forEach(s => document.getElementById(s).classList.add('hidden'));
      ['home', 'feed', 'nearby', 'friends'].forEach(d => { const el = document.getElementById(`dock-${d}`); if(el) el.classList.remove('active'); });
      if(t==='home') { document.getElementById('homeScreen').classList.remove('hidden'); document.getElementById('dock-home').classList.add('active'); loadStories(); }
      else if(t==='feed') { document.getElementById('feedScreen').classList.remove('hidden'); document.getElementById('dock-feed').classList.add('active'); fetchFeedPosts(); }
      else if(t==='nearby') { document.getElementById('nearbyHubScreen').classList.remove('hidden'); document.getElementById('dock-nearby').classList.add('active'); setNearbyRadius(100); }
      else if(t==='friends') { document.getElementById('connectionsHubScreen').classList.remove('hidden'); document.getElementById('dock-friends').classList.add('active'); }
    }

    // AUTH
    function toggleAuthModal() { document.getElementById('authModal').classList.toggle('hidden'); }
    function openProfileModal() { if(loggedInUser){ document.getElementById('myProfileImg').src=loggedInUser.avatar; document.getElementById('myProfileName').innerText=loggedInUser.channelName; document.getElementById('profileModal').classList.remove('hidden'); } }
    function closeProfileModal() { document.getElementById('profileModal').classList.add('hidden'); }
    async function submitAuth() {
      const e=document.getElementById('authEmail').value, p=document.getElementById('authPassword').value; if(!e||!p) return alert("Fill fields!");
      try { const r=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p})}); const d=await r.json();
        if(d.success){ loggedInUser=d.user; localStorage.setItem("user", JSON.stringify(loggedInUser)); updateUserUI(); toggleAuthModal(); } else alert(d.error);
      } catch(err){}
    }
    function restoreSavedUser() { const u = localStorage.getItem("user"); if(u){ loggedInUser=JSON.parse(u); updateUserUI(); } }
    function logoutUser() { localStorage.removeItem("user"); location.reload(); }
    function updateUserUI() {
      if(loggedInUser) { document.getElementById('authNavBtn').classList.add('hidden'); document.getElementById('userProfileBtn').classList.remove('hidden'); document.getElementById('headerUserName').innerText=loggedInUser.channelName; document.getElementById('headerUserAvatar').src=loggedInUser.avatar; document.getElementById('startBroadcastBtn').classList.remove('hidden'); }
      else { document.getElementById('authNavBtn').classList.remove('hidden'); document.getElementById('userProfileBtn').classList.add('hidden'); document.getElementById('startBroadcastBtn').classList.add('hidden'); }
    }

    // SOCKET & CHAT / VIDEO
    function initSocket() {
      if(socket) return; socket = io();
      socket.on("global_online_count", c => { const el=document.getElementById("globalOnlineCountUI"); if(el) el.innerText=c||0; });
      socket.on("partner_found", (data) => {
        isInitiator = data.isInitiator; document.getElementById("videoWaitingNotice").classList.add("hidden"); appendSystemMessage("Stranger Connected!");
        if (currentMode==='video' || currentMode==='audio') initRandomPeerConnection();
      });
      socket.on("receive_message", ({ text }) => appendMessage(text, "partner"));
      socket.on("partner_disconnected", () => { document.getElementById("videoWaitingNotice").classList.remove("hidden"); closePeer(); appendSystemMessage("Stranger Left."); resetGame(); });
      socket.on("webrtc_signal", async (sig) => {
        if(!peerConnection) return;
        if(sig.sdp) { await peerConnection.setRemoteDescription(new RTCSessionDescription(sig.sdp)); if(sig.sdp.type==="offer"){ const ans = await peerConnection.createAnswer(); await peerConnection.setLocalDescription(ans); socket.emit("webrtc_signal", {sdp: peerConnection.localDescription}); } }
        else if(sig.candidate) await peerConnection.addIceCandidate(new RTCIceCandidate(sig.candidate));
      });
      socket.on("new_story", s => { stories.unshift(s); renderStories(); });
      socket.on("new_post_published", p => { cachedPosts.unshift(p); renderFeedPosts(); });
      // Game
      socket.on("game_invite_received", () => { if(confirm("Play Tic-Tac-Toe?")) { socket.emit("game_accept"); startGame(false); } });
      socket.on("game_started", () => startGame(true)); socket.on("game_move_received", idx => applyGameMove(idx, 'O'));
      // Streams
      socket.on("stream_list_updated", list => renderStreamsList(list));
      socket.on("receive_stream_chat", ({senderName, text}) => { const box=document.getElementById('streamChatMessagesBox'); const d=document.createElement('div'); d.innerHTML=`<b>${senderName}:</b> ${text}`; box.appendChild(d); box.scrollTop=box.scrollHeight; });
    }

    async function startApp(mode) {
      currentMode = mode; switchMainTab('room'); document.getElementById('roomScreen').classList.remove('hidden');
      if (mode === 'video' || mode === 'audio') {
        document.getElementById('visualSection').classList.remove('hidden');
        if(mode==='video'){ document.getElementById('camBtn').classList.remove('hidden'); document.getElementById('localVideo').classList.remove('hidden'); document.getElementById('remoteVideo').classList.remove('hidden'); document.getElementById('localAudioAvatar').classList.add('hidden'); document.getElementById('remoteAudioAvatar').classList.add('hidden'); }
        if(mode==='audio'){ document.getElementById('camBtn').classList.add('hidden'); document.getElementById('localVideo').classList.add('hidden'); document.getElementById('remoteVideo').classList.add('hidden'); document.getElementById('localAudioAvatar').classList.remove('hidden'); document.getElementById('localAudioAvatar').classList.add('flex'); document.getElementById('remoteAudioAvatar').classList.remove('hidden'); document.getElementById('remoteAudioAvatar').classList.add('flex'); }
        try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: mode==='video' }); if(mode==='video') document.getElementById('localVideo').srcObject = localStream; } catch(e){ alert("Cam/Mic Error"); goHome(); }
      } else { document.getElementById('visualSection').classList.add('hidden'); }
      socket.emit("find_partner", { mode });
    }
    
    function initRandomPeerConnection() {
      closePeer(); peerConnection = new RTCPeerConnection(rtcConfig);
      if(localStream) localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
      peerConnection.ontrack = e => { if(currentMode==='video') document.getElementById('remoteVideo').srcObject = e.streams[0]; else { const au=new Audio(); au.srcObject=e.streams[0]; au.play(); } };
      peerConnection.onicecandidate = e => { if(e.candidate) socket.emit("webrtc_signal", {candidate: e.candidate}); };
      if(isInitiator) { peerConnection.createOffer().then(o => { peerConnection.setLocalDescription(o); socket.emit("webrtc_signal", {sdp: o}); }); }
    }
    function closePeer() { if(peerConnection){ peerConnection.close(); peerConnection=null; } document.getElementById('remoteVideo').srcObject=null; }

    function handleSendSubmit(e) { e.preventDefault(); const inp=document.getElementById('msgInput'), txt=inp.value.trim(); if(!txt) return; socket.emit("send_message", {text:txt}); appendMessage(txt, "me"); inp.value=""; }
    function appendMessage(txt, who) { const box=document.getElementById("messagesBox"), div=document.createElement("div"); div.className=who==="me"?"flex justify-end":"flex justify-start"; div.innerHTML=`<div class="max-w-[80%] px-3 py-1.5 rounded-xl text-xs ${who==='me'?'bg-blue-600 text-white':'bg-slate-100 text-slate-800'}">${txt}</div>`; box.appendChild(div); box.scrollTop=box.scrollHeight; }
    function appendSystemMessage(msg) { const box=document.getElementById("messagesBox"), div=document.createElement("div"); div.className="text-center my-1 text-[10px] text-slate-400"; div.innerText=msg; box.appendChild(div); }
    function nextPartner() { closePeer(); document.getElementById("messagesBox").innerHTML=""; document.getElementById("videoWaitingNotice").classList.remove("hidden"); resetGame(); socket.emit("find_partner", {mode:currentMode}); }
    function goHome(nav=true) { closePeer(); if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; } if(socket) socket.emit("leave_chat"); document.getElementById('messagesBox').innerHTML=''; resetGame(); if(nav) switchMainTab('home'); }
    function toggleAudio() { if(!localStream) return; isMuted=!isMuted; localStream.getAudioTracks().forEach(t=>t.enabled=!isMuted); document.getElementById('micBtn').innerText=isMuted?"🔇":"🎙️"; }
    function toggleVideo() { if(!localStream || currentMode!=='video') return; isCamOff=!isCamOff; localStream.getVideoTracks().forEach(t=>t.enabled=!isCamOff); document.getElementById('camBtn').innerText=isCamOff?"🚫":"📹"; }

    // GAME
    let board=['','','','','','','','',''], myMark='X', isMyTurn=false, gameActive=false;
    function inviteGame() { socket.emit("game_invite"); appendSystemMessage("Game invite sent..."); }
    function startGame(init) { document.getElementById('gameOverlay').classList.remove('hidden'); gameActive=true; board=['','','','','','','','','']; myMark=init?'X':'O'; isMyTurn=init; updateBoardUI(); }
    function updateBoardUI() { const grid=document.getElementById('ticTacToeBoard'); grid.innerHTML=''; document.getElementById('gameStatus').innerText = isMyTurn ? `Your Turn (${myMark})` : "Wait..."; board.forEach((cell, i) => { const d=document.createElement('div'); d.className=`game-cell ${cell==='X'?'text-blue-500':'text-pink-500'}`; d.innerText=cell; d.onclick=()=>{ if(isMyTurn && gameActive && board[i]===''){ board[i]=myMark; isMyTurn=false; updateBoardUI(); socket.emit("game_move", i); checkWin(); } }; grid.appendChild(d); }); }
    function applyGameMove(idx) { if(board[idx]==='') { board[idx]=myMark==='X'?'O':'X'; isMyTurn=true; updateBoardUI(); checkWin(); } }
    function checkWin() { const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; for(let w of wins) { if(board[w[0]] && board[w[0]]===board[w[1]] && board[w[0]]===board[w[2]]) { document.getElementById('gameStatus').innerText=`${board[w[0]]} Wins!`; gameActive=false; return; } } if(!board.includes('')){ document.getElementById('gameStatus').innerText="Draw!"; gameActive=false; } }
    function closeGame() { document.getElementById('gameOverlay').classList.add('hidden'); gameActive=false; }
    function resetGame() { closeGame(); }

    // STORIES
    async function loadStories() { try{ const res = await fetch("/api/stories"); const d = await res.json(); stories = d.stories||[]; renderStories(); }catch(e){} }
    function renderStories() { const box = document.getElementById("storiesContainer"); box.innerHTML = `<div class="flex flex-col items-center gap-1 shrink-0 cursor-pointer" onclick="document.getElementById('storyMediaInput').click()"><div class="w-14 h-14 rounded-full border border-dashed border-blue-400 flex items-center justify-center text-blue-500 text-2xl bg-blue-50">+</div><span class="text-[10px] font-bold text-slate-500">Add Story</span><input type="file" id="storyMediaInput" accept="image/*" class="hidden" onchange="uploadStory(event)"></div>` + stories.map((s, i) => `<div class="flex flex-col items-center gap-1 shrink-0 cursor-pointer" onclick="viewStory(${i})"><div class="story-ring"><img src="${s.authorAvatar||'https://api.dicebear.com/7.x/bottts/svg?seed=user'}" class="w-12 h-12 story-img"></div><span class="text-[10px] font-bold text-slate-700 w-14 truncate text-center">${s.authorName||'User'}</span></div>`).join(""); }
    function uploadStory(e) { const file=e.target.files[0]; if(!file) return; if(!loggedInUser) return alert("लॉगिन करें!"); const reader=new FileReader(); reader.onload=async ev => { try{ await fetch("/api/stories/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:loggedInUser.email,media:ev.target.result})}); alert("Story Added!"); loadStories(); }catch(err){} }; reader.readAsDataURL(file); }
    let storyTimer; function viewStory(idx) { const s=stories[idx]; if(!s) return; document.getElementById('viewStoryImg').src=s.media; document.getElementById('viewStoryAvatar').src=s.authorAvatar||''; document.getElementById('viewStoryName').innerText=s.authorName||''; document.getElementById('storyViewer').classList.remove('hidden'); const p=document.getElementById('storyProgress'); p.style.width='0%'; setTimeout(()=>p.style.width='100%', 50); clearTimeout(storyTimer); storyTimer=setTimeout(closeStory, 5000); }
    function closeStory() { document.getElementById('storyViewer').classList.add('hidden'); clearTimeout(storyTimer); }

    // FEED
    async function fetchFeedPosts() { try{ const res=await fetch("/api/posts"); const d=await res.json(); cachedPosts=d.posts||[]; renderFeedPosts(); }catch(e){} }
    function renderFeedPosts() { const box=document.getElementById("feedPostsContainer"); if(!cachedPosts.length) { box.innerHTML=`<div class="text-center py-10 text-xs text-slate-400">कोई पोस्ट नहीं।</div>`; return; } box.innerHTML = cachedPosts.map(p => `<div class="panel-card overflow-hidden"><div class="p-3 flex items-center gap-2"><img src="${p.authorAvatar}" class="w-8 h-8 rounded-full border"><span class="text-xs font-bold">${p.authorName}</span></div>${p.media?`<img src="${p.media}" class="w-full max-h-64 object-cover">`:''}<div class="p-3 text-xs text-slate-700">${p.caption||''}</div></div>`).join(""); }
    function openCreatePostModal() { if(!loggedInUser) return alert("लॉगिन करें!"); document.getElementById('createPostModal').classList.remove('hidden'); }
    function closeCreatePostModal() { document.getElementById('createPostModal').classList.add('hidden'); }
    function handlePostMedia(e) { const file=e.target.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=ev => { tempPostMediaBase64=ev.target.result; document.getElementById('postImgPreview').src=tempPostMediaBase64; document.getElementById('postImgPreview').classList.remove('hidden'); }; reader.readAsDataURL(file); }
    async function submitNewPost() { const cap=document.getElementById('postCaptionInput').value; if(!tempPostMediaBase64 && !cap) return; try{ await fetch("/api/posts/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:loggedInUser.email,media:tempPostMediaBase64,caption:cap})}); closeCreatePostModal(); fetchFeedPosts(); }catch(e){} }

    // LIVE STREAM HUB
    function openStreamHub() { switchMainTab('none'); document.getElementById('homeScreen').classList.add('hidden'); document.getElementById('streamHubScreen').classList.remove('hidden'); socket.emit("get_streams"); }
    function renderStreamsList(streams) { const box=document.getElementById("streamsListContainer"); if(!streams||!streams.length) { box.innerHTML=`<div class="col-span-full text-center py-10 text-xs text-slate-500">कोई क्रिएटर लाइव नहीं है।</div>`; return; } box.innerHTML = streams.map(s => `<div class="panel-card p-3 flex items-center justify-between"><div class="flex items-center gap-2"><img src="${s.avatar}" class="w-10 h-10 rounded-full border"><div class="text-left"><h4 class="text-xs font-bold text-slate-800">${s.channelName}</h4><p class="text-[9px] text-red-500 font-bold">🔴 LIVE (${s.viewers} Views)</p></div></div><button onclick="joinStream('${s.streamId}')" class="px-3 py-1 bg-green-500 text-white rounded-xl text-xs font-bold">Join</button></div>`).join(""); }
    async function startBroadcasting() { try{ localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true}); document.getElementById('streamVideoPlayer').srcObject=localStream; document.getElementById('activeStreamPlayer').classList.remove('hidden'); document.getElementById('streamsListWrapper').classList.add('hidden'); document.getElementById('streamerStopBtn').classList.remove('hidden'); socket.emit("start_stream", {email:loggedInUser.email, channelName:loggedInUser.channelName, avatar:loggedInUser.avatar}); }catch(e){alert("Cam error");} }
    function stopBroadcast() { if(localStream) localStream.getTracks().forEach(t=>t.stop()); document.getElementById('activeStreamPlayer').classList.add('hidden'); document.getElementById('streamsListWrapper').classList.remove('hidden'); document.getElementById('streamerStopBtn').classList.add('hidden'); socket.emit("leave_stream", {streamId:"stream_"+socket.id}); socket.emit("get_streams"); }
    function joinStream(sId) { currentActiveStreamId=sId; document.getElementById('activeStreamPlayer').classList.remove('hidden'); document.getElementById('streamsListWrapper').classList.add('hidden'); document.getElementById('viewerCloseStreamBtn').classList.remove('hidden'); socket.emit("join_stream", {streamId:sId}); }
    function leaveCurrentStream() { if(currentActiveStreamId) socket.emit("leave_stream", {streamId:currentActiveStreamId}); document.getElementById('streamVideoPlayer').srcObject=null; document.getElementById('activeStreamPlayer').classList.add('hidden'); document.getElementById('streamsListWrapper').classList.remove('hidden'); document.getElementById('viewerCloseStreamBtn').classList.add('hidden'); }
    function handleSendStreamChat(e) { e.preventDefault(); const inp=document.getElementById('streamChatInput'), txt=inp.value.trim(); if(!txt) return; socket.emit("send_stream_chat", {streamId:currentActiveStreamId||"stream_"+socket.id, text:txt, senderName:loggedInUser?loggedInUser.channelName:"Viewer"}); inp.value=""; }

    // NEARBY
    function setNearbyRadius(r) { 
      currentRadiusKM = r;
      [25, 100].forEach(val => { let btn = document.getElementById(`radBtn${val}`); if(btn) { if(val===r){ btn.classList.remove('bg-white','text-slate-600','border'); btn.classList.add('btn-blue'); }else{ btn.classList.add('bg-white','text-slate-600','border'); btn.classList.remove('btn-blue'); } } });
      document.getElementById("nearbyListContainer").innerHTML = `<div class="text-center py-10 text-xs text-slate-500">लोकेशन चालू करें...</div>`;
    }
  </script>

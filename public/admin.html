<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sukoon CyberAdmin Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { background-color: #09090b; color: #e2e8f0; font-family: monospace; }
    .cyber-panel { background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(34, 211, 238, 0.2); box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    .neon-text { text-shadow: 0 0 10px currentColor; }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col selection:bg-cyan-500/30">

  <div id="adminLoginScreen" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
    <div class="cyber-panel p-8 rounded-xl max-w-sm w-full space-y-5 border-cyan-500/50">
      <div class="text-center space-y-2">
        <h2 class="text-2xl font-black text-cyan-400 tracking-widest neon-text">SYS_ADMIN</h2>
        <p class="text-[10px] text-slate-400 uppercase tracking-widest">Secure Gateway</p>
      </div>
      <form onsubmit="handleAdminLogin(event)" class="space-y-4">
        <input type="text" id="admUser" required placeholder="USERNAME" class="w-full bg-black/50 border border-cyan-500/30 rounded p-3 text-xs text-cyan-300 focus:outline-none focus:border-cyan-400">
        <input type="password" id="admPass" required placeholder="PASSWORD" class="w-full bg-black/50 border border-cyan-500/30 rounded p-3 text-xs text-cyan-300 focus:outline-none focus:border-cyan-400">
        <button type="submit" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-black font-black uppercase tracking-widest rounded text-xs transition">Authenticate</button>
      </form>
    </div>
  </div>

  <div id="adminDashboard" class="hidden max-w-6xl w-full mx-auto space-y-6 pb-12">
    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-black text-cyan-400 tracking-widest neon-text">SUKOON COMMAND CENTER</h1>
        <p class="text-xs text-slate-500 uppercase mt-1 tracking-widest">Global Server Metrics & Control</p>
      </div>
      <button onclick="adminLogout()" class="px-4 py-2 border border-rose-500/50 text-rose-400 hover:bg-rose-500/10 rounded uppercase text-[10px] font-bold tracking-widest transition">Terminate Session</button>
    </div>

    <!-- Metrics -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
      <div class="p-5 cyber-panel rounded-xl"><div class="text-[10px] text-slate-400 uppercase tracking-widest">Active Nodes</div><div id="m-users" class="text-3xl font-black text-emerald-400 mt-2 neon-text">0</div></div>
      <div class="p-5 cyber-panel rounded-xl"><div class="text-[10px] text-slate-400 uppercase tracking-widest">Data Packets</div><div id="m-posts" class="text-3xl font-black text-cyan-400 mt-2 neon-text">0</div></div>
      <div class="p-5 cyber-panel rounded-xl"><div class="text-[10px] text-slate-400 uppercase tracking-widest">Live Uplinks</div><div id="m-streams" class="text-3xl font-black text-purple-400 mt-2 neon-text">0</div></div>
      <div class="p-5 cyber-panel rounded-xl"><div class="text-[10px] text-slate-400 uppercase tracking-widest">Registered IDs</div><div id="m-reg" class="text-3xl font-black text-amber-400 mt-2 neon-text">0</div></div>
      <div class="p-5 cyber-panel rounded-xl"><div class="text-[10px] text-slate-400 uppercase tracking-widest">Security Flags</div><div id="m-incidents" class="text-3xl font-black text-rose-500 mt-2 neon-text">0</div></div>
    </div>

    <!-- Users Table with Ban Feature -->
    <div class="cyber-panel p-6 rounded-xl space-y-4">
      <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-widest border-b border-slate-800 pb-2">User Registry & Moderation</h2>
      <div class="overflow-x-auto max-h-96 overflow-y-auto">
        <table class="w-full text-xs text-left">
          <thead class="sticky top-0 bg-[#18181b] border-b border-cyan-500/20 text-cyan-600/70 uppercase tracking-widest">
            <tr><th class="py-3 px-2">Entity ID / Email</th><th class="px-2">Clearance</th><th class="px-2">Alias</th><th class="px-2">System Status</th><th class="px-2">Override Command</th></tr>
          </thead>
          <tbody id="allUsersBody" class="divide-y divide-slate-800/50"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let adminToken = sessionStorage.getItem("sukoon_admin_token"); let socket;
    window.addEventListener("load", () => { if (adminToken === "sukoon_admin_auth_verified_2026") showDashboard(); });

    async function handleAdminLogin(e) {
      e.preventDefault(); const u = document.getElementById('admUser').value; const p = document.getElementById('admPass').value;
      try {
        const res = await fetch("/api/admin/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: u, password: p }) });
        const d = await res.json(); if (d.success) { adminToken = d.token; sessionStorage.setItem("sukoon_admin_token", adminToken); showDashboard(); } else alert("ACCESS DENIED");
      } catch (err) {}
    }

    function showDashboard() { document.getElementById('adminLoginScreen').classList.add('hidden'); document.getElementById('adminDashboard').classList.remove('hidden'); connectAdminSocket(); }
    function adminLogout() { sessionStorage.removeItem("sukoon_admin_token"); location.reload(); }

    function connectAdminSocket() {
      socket = io({ reconnection: true, reconnectionDelay: 1000 });
      socket.on("connect", () => socket.emit("join_admin", { token: adminToken }));
      
      socket.on("admin_metrics", (m) => {
        document.getElementById("m-users").innerText = m.onlineUsers || 0;
        document.getElementById("m-posts").innerText = m.postsCount || 0;
        document.getElementById("m-streams").innerText = m.liveStreamsCount || 0;
        document.getElementById("m-reg").innerText = m.registeredUsers?.length || 0;
        document.getElementById("m-incidents").innerText = m.incidents?.length || 0;

        const allUsersTbody = document.getElementById("allUsersBody");
        if (m.registeredUsers && m.registeredUsers.length > 0) {
          allUsersTbody.innerHTML = m.registeredUsers.map(u => `
            <tr class="hover:bg-cyan-900/10 transition">
              <td class="py-3 px-2 text-slate-300 font-bold">${u.email}</td>
              <td class="px-2"><span class="px-2 py-0.5 border border-slate-700 rounded text-[9px] uppercase tracking-widest text-slate-400">${u.role}</span></td>
              <td class="px-2 text-slate-400">${u.channelName || 'N/A'}</td>
              <td class="px-2"><span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider ${u.isBanned ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'}">${u.isBanned ? 'BANNED' : 'ACTIVE'}</span></td>
              <td class="px-2">
                <button onclick="toggleBan('${u.email}', ${!u.isBanned})" class="px-3 py-1.5 rounded text-[10px] font-bold uppercase tracking-widest transition ${u.isBanned ? 'bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600/40 border border-emerald-500/50' : 'bg-rose-600/20 text-rose-400 hover:bg-rose-600/40 border border-rose-500/50'}">
                  ${u.isBanned ? 'Restore Access' : 'Execute Ban'}
                </button>
              </td>
            </tr>
          `).join("");
        }
      });
    }

    async function toggleBan(email, banStatus) {
      if(!confirm(`WARNING: Executing override for ${email}. Proceed?`)) return;
      try { await fetch("/api/admin/ban-user", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email, token: adminToken, banStatus }) }); } catch (e) {}
    }
  </script>
</body>
</html>
